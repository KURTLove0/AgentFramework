[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-agent-mvp"
version = "1.2.0"
description = "Durable Agent workbench with governed workflows and simulated business tools"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.3,<7"]

[project.scripts]
agent-mvp = "agent_framework.cli:main"

[tool.setuptools.packages.find]
include = ["agent_framework*"]

[tool.setuptools.package-data]
agent_framework = ["resources/*.json", "resources/*.md", "resources/skills/*/SKILL.md", "resources/skills/*/references/*", "webui/*.html", "webui/*.css", "webui/*.js", "webui/*.ttf", "webui/OFL-*.txt"]
